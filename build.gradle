plugins {
	id 'java'
	id 'io.papermc.paperweight.userdev' version "${paperweight_version}"
	id 'com.gradleup.shadow' version "${shadow_version}"
}

group = 'msptmap'
version = mod_version

repositories {
	mavenCentral()
	maven {
		name = 'PaperMC'
		url = 'https://repo.papermc.io/repository/maven-public/'
	}
}

dependencies {
	paperweight.paperDevBundle(paper_version)
	// 聊天行使用 Bungee Chat 组件（Paper / Spigot 均自带）
	compileOnly 'net.md-5:bungeecord-chat:1.21-R0.2-deprecated+build.21'
	implementation "org.ow2.asm:asm:${asm_version}"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(java_version as int)
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = java_version as int
}

// 26.x 的服务端本身不再混淆，产出保持 Mojang 名即可
paperweight.reobfArtifactConfiguration =
		io.papermc.paperweight.userdev.ReobfArtifactConfiguration.getMOJANG_PRODUCTION()

// plugin.yml 的版本与 API 版本由构建填写，避免与版本配置不一致
processResources {
	def pluginVersion = project.version
	def pluginApiVersion = api_version
	inputs.property 'version', pluginVersion
	inputs.property 'apiVersion', pluginApiVersion
	filesMatching('plugin.yml') {
		expand version: pluginVersion, apiVersion: pluginApiVersion
	}
}

// 单一 jar：插件类、注入器类与重定位后的 ASM 打在一起
shadowJar {
	def pluginVersion = project.version
	def packageMc = jar_mc
	archiveFileName = "MsptMap-Plugin-${pluginVersion}-alpha+${packageMc}.jar"
	// Paper 自带 ASM，必须改名后打包，避免与服务器自身的 ASM 冲突
	relocate 'org.objectweb.asm', 'msptmap.lib.asm'
	exclude 'META-INF/MANIFEST.MF'
	exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
	manifest {
		attributes(
				'Premain-Class': 'msptmap.agent.Agent',
				'Can-Retransform-Classes': 'true',
				'Implementation-Title': 'MsptMap-Plugin',
				'Implementation-Version': pluginVersion
		)
	}
}

// 只保留 shadowJar 的产物，避免 libs 下同时出现一个不含依赖的普通 jar
tasks.named('jar') {
	enabled = false
}

tasks.named('build') {
	dependsOn tasks.named('shadowJar')
}
