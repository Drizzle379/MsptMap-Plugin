org.gradle.jvmargs=-Xmx2G
# 关闭并行：Stonecutter 多版本子项目会写同一批生成目录，并行构建会互相踩产物
org.gradle.parallel=false
org.gradle.configuration-cache=false
org.gradle.caching=true

# 用 Groovy 控制器时的官方开关：关掉「Groovy DSL 支持有限」提示警告
dev.kikugie.stonecutter.hard_mode=true

# 与 MC 版本无关的依赖版本
paperweight_version=2.0.0-SNAPSHOT
asm_version=9.9.1
shadow_version=9.6.1

# 本插件
mod_version=1.0.2

# 以下属性按 MC 版本分别写在 versions/<版本>/gradle.properties 里：
#   paper_version / java_version / api_version / jar_mc
