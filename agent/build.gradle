plugins {
	id 'java'
	id 'io.papermc.paperweight.userdev' version "${paperweight_version}"
	id 'com.gradleup.shadow' version "${shadow_version}"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

dependencies {
	paperweight.paperDevBundle("${paper_version}")
	implementation "org.ow2.asm:asm:${asm_version}"
}

// 26.x 的服务端本身不再混淆，产出保持 Mojang 名即可
paperweight.reobfArtifactConfiguration =
		io.papermc.paperweight.userdev.ReobfArtifactConfiguration.getMOJANG_PRODUCTION()

shadowJar {
	archiveBaseName = 'MsptMap-Agent'
	archiveClassifier = ''
	// Paper 自带 ASM，必须改名后打包，避免与服务器自身的 ASM 冲突
	relocate 'org.objectweb.asm', 'msptmap.lib.asm'
	exclude 'META-INF/MANIFEST.MF'
	exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}
