# MsptMap 服务端配置。命令修改后立即写入本文件；手工修改请重启服务端。
# access：谁可以发起扫描。ops = 仅 OP（默认），all = 所有玩家。
access: ops

monitor:
  # 常态 MSPT 监控：持续高于阈值时自动扫描一次，并把最重的区块发给受众。
  enabled: false
  # 阈值（mspt）。平滑窗口与去抖次数固定，不在此配置。
  threshold: 40.0
  # 两次自动扫描之间的最短间隔（分钟）。
  cooldown-minutes: 5
  # 告警接收范围。op = 仅在线 OP（默认），all = 所有在线玩家。
  audience: op
