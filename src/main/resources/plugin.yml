name: MsptMap
version: '${version}'
main: msptmap.plugin.MsptMapPlugin
api-version: '${apiVersion}'
description: Per-chunk MSPT heat map for clients running the msptmap-fabric mod
commands:
  msptmap:
    description: Start a scan or manage MsptMap settings
    usage: /msptmap <scan|access|monitor>
permissions:
  msptmap.use:
    description: Allow starting a scan
    default: op
  msptmap.admin:
    description: Allow changing access and monitor settings
    default: op
